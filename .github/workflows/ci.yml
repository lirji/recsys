name: CI

# 最小 CI(E3):build + 测试门槛 + JaCoCo 契约类覆盖率门槛 + ONNX 单文件校验 + 在线/离线契约跨语言校验。
# 目标:任何改动若破坏"在线/离线一致性"或"陈旧 target/classes / 外部权重"这类部署即崩的隐患,都在合入前拦截。

on:
  push:
    branches: [ main ]
  pull_request:

# 并发:同一分支新推送取消旧运行,省 CI 资源
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # clean verify:强制重编(clean 防陈旧 target/classes 把旧资源打进 jar)+ 跑全部测试
      # + verify 阶段触发 JaCoCo 契约类覆盖率门槛(契约编码器覆盖率跌破 50% 即失败)。
      # ubuntu runner 自带 Docker,E2 的 Testcontainers 集成测试可直接运行。
      - name: Build, test & coverage gate
        run: mvn -B -e clean verify

      # ONNX 必须是单文件自包含,否则在线从 classpath 加载缺权重而崩。
      - name: ONNX self-contained check
        run: bash scripts/check_onnx_selfcontained.sh

      # 在线(Java)/离线(Python)编码契约共读同一 golden 固件,此步校验 Python 侧;
      # Java 侧由上面的 mvn verify(RankEncoderContractGoldenTest)覆盖。
      - name: On/offline contract cross-check (Python)
        run: python3 scripts/verify_contracts.py

      - name: Mapper boundaries and historical SQL integrity
        run: |
          python3 scripts/test_persistence_boundaries.py
          python3 scripts/check_persistence_boundaries.py

      - name: Shared error contract and generated code consistency
        run: |
          python3 scripts/test_error_codes.py
          python3 scripts/generate_error_codes.py --check
          python3 scripts/check_public_errors.py

      # 覆盖率报告存档,便于人工查看趋势(不阻断)。
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports
          path: '**/target/site/jacoco/**'
          if-no-files-found: ignore

  # P1 钱链路验证闸门:一个独立、可见的 required check。只跑 @Tag("money-chain") 的计费关键测试——
  # GSP 次价 / bill-factor / oCPC 计费数学(BiddingServiceBillFactorTest/VcgAuctionTest/BidTypeTest)
  # + SponsoredAd 经 proto 边界逐字段无损(AdBillingProtoParityTest)。
  # S06:同时覆盖 sandbox PG/Kafka 故障窗口、owner RPC、engine HTTP 和 gateway ADMIN 边界。
  # 语义:in-process 与 gRPC 两种 ad-serving 模式必须收一样的钱。此 gate 常绿是 P3 把 AD_SERVING_MODE
  # 翻成 grpc 默认的硬前提——不绿不翻转。
  money-chain-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Money-chain consistency gate
        run: mvn -B -e -pl recsys-rec-engine,recsys-ad-serving,recsys-advertiser,recsys-gateway -am test -Dgroups=money-chain -Dsurefire.failIfNoSpecifiedTests=false

  # S08 参数化自然资格/回执：必须实际跑 PG 并发和回滚，默认关闭能力不代表测试跳过。
  natural-exposure-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Natural qualification and atomic receipt gate
        run: mvn -B -e -pl recsys-rec-engine,recsys-behavior,recsys-gateway -am test -Dgroups=natural-exposure -Dsurefire.failIfNoSpecifiedTests=false
      # S15A 保留真实进程退出窗口与原事件/offset 证据，失败也上传，不能只看进程健康。
      - name: Upload natural event recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: natural-event-recovery-evidence
          path: |
            recsys-behavior/target/natural-event-evidence/**
            recsys-behavior/target/surefire-reports/**
          if-no-files-found: warn

  # S15B1/B2 原子接受、历史清单恢复与旧消费兼容；真实组件测试不允许无Docker跳过。
  behavior-reliability-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Behavior atomic capture and isolated recovery gate
        run: mvn -B -e -pl recsys-behavior,recsys-rec-engine,recsys-streaming -am test -Dgroups=behavior-reliability -Dsurefire.failIfNoSpecifiedTests=false
      - name: Upload behavior event recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: behavior-event-recovery-evidence
          path: |
            recsys-behavior/target/behavior-event-evidence/**
            recsys-behavior/target/surefire-reports/**
            recsys-rec-engine/target/surefire-reports/**
            recsys-streaming/target/surefire-reports/**
          if-no-files-found: warn

  # S16A 独占双物理PG、实际ShardingSphere、Kafka/独立JVM和相关旧API回归。
  catalog-reliability-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Catalog producer, projection, HTTP and recovery gate
        run: mvn -B -e -pl recsys-advertiser,recsys-offline,recsys-ad-serving -am test '-Dtest=Catalog*Test,AdServablePostgresTest,AdCatalogEventRoundTripTest,SeedAdsPostgresTest,AdvertiserRepositoryPostgresTest,CreativeReviewTest,AdvertiserAuthzTest' -Dsurefire.failIfNoSpecifiedTests=false
      - name: Upload catalog acceptance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-reliability-reports
          # 仅合成隔离数据的测试报告；不上传产品ready文件、凭据或原命令原文。
          path: |
            recsys-advertiser/target/surefire-reports/TEST-*.xml
            recsys-offline/target/surefire-reports/TEST-*.xml
            recsys-ad-serving/target/surefire-reports/TEST-*.xml
          if-no-files-found: warn

  sandbox-exposure-browser-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: Install browser test dependencies
        working-directory: console
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Frontend types, unit tests and build
        working-directory: console
        run: |
          npm run typecheck
          npm run test:run
          npm run build
      - name: Isolated browser, PostgreSQL and Kafka acceptance
        run: python3 scripts/test-sandbox-exposure.py
      - name: Public error, data quality and advertiser browser recovery
        working-directory: console
        run: npx playwright test e2e/public-errors.spec.ts e2e/data-quality-status.spec.ts e2e/advertiser-workflows.spec.ts e2e/sandbox-actions-disabled.spec.ts --output=../recsys-rec-engine/target/public-error-browser-evidence
      - name: Isolated natural browser and PostgreSQL acceptance
        run: python3 scripts/test-natural-exposure.py
      - name: Isolated mixed feed browser and PostgreSQL acceptance
        run: python3 scripts/test-feed-exposure.py
      - name: Isolated read-only reconciliation browser, PostgreSQL and RPC acceptance
        run: python3 scripts/test-sandbox-reconciliation.py
      - name: Upload sandbox browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-exposure-evidence
          path: |
            recsys-rec-engine/target/browser-evidence/
            recsys-rec-engine/target/sandbox-browser-backend.log
            recsys-rec-engine/target/natural-browser-evidence/
            recsys-rec-engine/target/natural-browser-backend.log
            recsys-rec-engine/target/feed-browser-evidence/
            recsys-rec-engine/target/feed-browser-backend.log
            recsys-rec-engine/target/public-error-browser-evidence/
            recsys-ad-serving/target/reconciliation-evidence-*/*.png
            recsys-ad-serving/target/reconciliation-evidence-*/**/*.png
          if-no-files-found: ignore

  sandbox-actions-browser-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mode: [in-process, grpc]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: Install browser dependencies
        working-directory: console
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Real CPC and CPA browser, PostgreSQL and RPC acceptance
        env:
          ACTIONS_MODE: ${{ matrix.mode }}
        run: python3 scripts/test-click-conversion-ui.py
      - name: Upload masked screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-actions-${{ matrix.mode }}
          # 只发布显式遮挡证明的截图；自动失败上下文/请求轨迹不进入公开 artifact。
          path: recsys-ad-serving/target/actions-evidence-${{ matrix.mode }}/**/*.png
          if-no-files-found: ignore

  # P3 供应链安全:Trivy 文件系统扫描——后端 Maven / 前端 npm 依赖漏洞(SCA)+ IaC/配置误配。
  # 与 Dependabot(自动升级 PR)互补。教学默认不阻断(报告);生产设 exit-code=1 + severity 收紧即成硬门槛。
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan (deps + misconfig)
        uses: aquasecurity/trivy-action@v0.24.0
        with:
          scan-type: fs
          scanners: vuln,misconfig
          format: table
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
